<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        form { background: #f5f5f5; padding: 20px; border-radius: 8px; }
        label { display: block; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #134c78; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #0d3a5c; }
        #result { margin-top: 20px; padding: 10px; border-radius: 4px; white-space: pre-wrap; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Contact Form Test</h1>
    <form id="contactForm">
        <label for="firstName">First Name *</label>
        <input type="text" id="firstName" required value="Test">

        <label for="lastName">Last Name *</label>
        <input type="text" id="lastName" required value="User">

        <label for="email">Email *</label>
        <input type="email" id="email" required value="test@example.com">

        <label for="phone">Phone</label>
        <input type="tel" id="phone" value="1234567890">

        <label for="service">Service</label>
        <select id="service">
            <option value="tax-advisory">Tax Advisory</option>
            <option value="audit-service">Audit Service</option>
            <option value="gst-service">GST Service</option>
            <option value="government-subsidies">Government Subsidies</option>
        </select>

        <label for="message">Message *</label>
        <textarea id="message" rows="4" required>This is a test message from the contact form test page.</textarea>

        <button type="submit">Send Test Message</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Sending...';
            resultDiv.className = '';

            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                service: document.getElementById('service').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.textContent = 'SUCCESS!\n\n' + JSON.stringify(result, null, 2);
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = 'ERROR:\n\n' + JSON.stringify(result, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = 'NETWORK ERROR:\n\n' + error.message;
            }
        });
    </script>
</body>
</html>
